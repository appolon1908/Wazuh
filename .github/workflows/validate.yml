name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh
      - name: Verify upstream release
        run: git ls-remote --exit-code --tags https://github.com/wazuh/wazuh-docker.git refs/tags/v4.14.7
      - name: Reject committed secrets
        run: |
          test ! -f .env
          ! git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})'
